name: Deploy to Yandex Cloud Serverless Containers
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Run unit tests
        run: dotnet test tests/EventSync.UnitTests/EventSync.UnitTests.csproj --configuration Release

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Build and push Docker image
        run: |
          docker build -t cr.yandex/${{ secrets.YC_REGISTRY_ID }}/myapp:${{ github.sha }} .
          docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/myapp:${{ github.sha }}

      - name: Deploy new revision
        uses: yc-actions/yc-sls-container-deploy@v5
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          folder-id: ${{ secrets.YC_FOLDER_ID }}
          revision-service-account-id: ${{ secrets.YC_SA_ID }}
          container-name: myapp
          revision-image-url: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/myapp:${{ github.sha }}
          revision-memory: 512MB
          revision-cores: 1
          revision-network-id: enphqfrmf1asvafuao75
          revision-env: |
            ASPNETCORE_ENVIRONMENT=Production
            ${{ secrets.DGIS_API_KEY && format('TwoGis__ApiKey={0}', secrets.DGIS_API_KEY) || '' }}
          revision-secrets: |
            ConnectionStrings__DefaultConnection=e6q5g00uaq06cn37ojug/e6qo494pb2964cb94cfq/db-connection-string
            Telegram__BotToken=e6q5g00uaq06cn37ojug/e6qo494pb2964cb94cfq/telegram-bot-token

