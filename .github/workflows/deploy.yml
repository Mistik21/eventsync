name: Deploy to Yandex Cloud Serverless Containers
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Run unit tests
        run: dotnet test tests/EventSync.UnitTests/EventSync.UnitTests.csproj --configuration Release

  smoke:
    name: Docker smoke test
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE: eventsync:${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        env:
          VITE_2GIS_API_KEY: ${{ github.event_name == 'push' && secrets.DGIS_API_KEY || '' }}
        run: docker build --build-arg VITE_2GIS_API_KEY -t "$IMAGE" .

      - name: Run Docker smoke test
        shell: bash
        run: |
          container="$(docker run -d -p 127.0.0.1:18080:8080 "$IMAGE")"
          cleanup() {
            docker logs "$container" || true
            docker rm -f "$container" >/dev/null || true
          }
          trap cleanup EXIT
          url=http://127.0.0.1:18080

          for _ in {1..30}; do
            if [[ "$(curl -s --max-time 2 -o /dev/null -w '%{http_code}' "$url/")" == 200 ]]; then
              break
            fi
            sleep 1
          done

          entry="$(curl -fsS "$url/" | sed -n 's/.*src="\(\/react\/assets\/[^\"]*\.js\)".*/\1/p')"
          test -n "$entry"
          for path in / /profile "$entry"; do
            status="$(curl -sS --max-time 5 -o /dev/null -w '%{http_code}' "$url$path")"
            echo "$path returned HTTP $status"
            test "$status" = 200
          done

      - name: Save verified Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker image save -o "$RUNNER_TEMP/eventsync-image.tar" "$IMAGE"

      - name: Upload verified Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: eventsync-image-${{ github.sha }}
          path: ${{ runner.temp }}/eventsync-image.tar
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  deploy:
    name: Deploy to Yandex Cloud
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Docker image
        uses: actions/download-artifact@v8
        with:
          name: eventsync-image-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Load verified Docker image
        run: docker image load -i "$RUNNER_TEMP/eventsync-image.tar"

      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Push verified Docker image
        env:
          REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
        run: |
          registry_image="cr.yandex/$REGISTRY_ID/myapp:$GITHUB_SHA"
          docker tag "eventsync:$GITHUB_SHA" "$registry_image"
          docker push "$registry_image"

      - name: Deploy new revision
        uses: yc-actions/yc-sls-container-deploy@v5
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          folder-id: ${{ secrets.YC_FOLDER_ID }}
          revision-service-account-id: ${{ secrets.YC_SA_ID }}
          container-name: myapp
          revision-image-url: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/myapp:${{ github.sha }}
          revision-memory: 512MB
          revision-cores: 1
          revision-execution-timeout: '60'
          revision-concurrency: '3'
          revision-provisioned: '1'
          revision-network-id: enphqfrmf1asvafuao75
          revision-env: |
            ASPNETCORE_ENVIRONMENT=Production
            ${{ vars.TELEGRAM_RELAY_URL && format('Telegram__RelayUrl={0}', vars.TELEGRAM_RELAY_URL) || '' }}
            ObjectStorage__Bucket=${{ vars.OBJECT_STORAGE_BUCKET }}
          revision-secrets: |
            ConnectionStrings__DefaultConnection=e6q5g00uaq06cn37ojug/e6qo494pb2964cb94cfq/db-connection-string
            Telegram__BotToken=e6q5g00uaq06cn37ojug/e6qo494pb2964cb94cfq/telegram-bot-token
            ${{ vars.TELEGRAM_RELAY_LOCKBOX_REFERENCE && format('Telegram__RelaySecret={0}', vars.TELEGRAM_RELAY_LOCKBOX_REFERENCE) || '' }}
            ${{ vars.TELEGRAM_REMINDER_LOCKBOX_REFERENCE && format('Telegram__ReminderSecret={0}', vars.TELEGRAM_REMINDER_LOCKBOX_REFERENCE) || '' }}
            ObjectStorage__AccessKeyId=${{ vars.OBJECT_STORAGE_LOCKBOX_REFERENCE }}/access-key-id
            ObjectStorage__SecretAccessKey=${{ vars.OBJECT_STORAGE_LOCKBOX_REFERENCE }}/secret-access-key

