<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f8f8f7">
    <title>EventSync</title>
    <script>
        if (/^\/(?:html\/index\.html)?$/i.test(location.pathname)) {
            window.eventSyncEvents = fetch('/api/events', { cache: 'no-store' }).catch(() => null);
        }
        window.eventSyncTelegram = new Promise(resolve => {
            const sdk = document.createElement('script');
            sdk.src = 'https://telegram.org/js/telegram-web-app.js';
            const timeout = setTimeout(resolve, 3500);
            sdk.onload = () => {
                clearTimeout(timeout);
                window.Telegram?.WebApp?.ready();
                window.Telegram?.WebApp?.expand();
                resolve();
            };
            sdk.onerror = () => { clearTimeout(timeout); resolve(); };
            document.head.append(sdk);
        });
    </script>
</head>
<body>
    <div id="root">
        <main id="startup" class="events-screen" hidden>
            <header class="events-header">
                <span class="events-mark" aria-hidden="true">▣</span>
                <h1>Мои события</h1>
                <a class="profile-badge" href="/profile" aria-label="Открыть профиль">П</a>
            </header>
            <p class="events-status" role="status" data-loading-status>Загружаем события…</p>
        </main>
    </div>
    <script>
        if (window.eventSyncEvents) document.getElementById('startup').hidden = false;
    </script>
    <noscript>Для работы EventSync нужен JavaScript.</noscript>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
