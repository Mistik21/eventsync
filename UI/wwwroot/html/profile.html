<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f8f8f7">
    <title>Профиль · EventSync</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/profile.css">
    <script type="module" src="/js/profile.js"></script>
</head>
<body>
    <main class="profile-screen">
        <header class="profile-header">
            <h1>Профиль</h1>
            <a class="profile-home" href="/">Мои события</a>
        </header>

        <p id="profile-status" class="profile-status" role="status">Загружаем профиль…</p>

        <section id="profile-details" aria-labelledby="profile-name" hidden>
            <div class="profile-card">
                <div id="profile-avatar" class="profile-avatar" aria-hidden="true"></div>
                <h2 id="profile-name"></h2>
            </div>

            <dl class="profile-stat">
                <dt>Посещённые события</dt>
                <dd id="profile-attended-count"></dd>
            </dl>
        </section>
    </main>
</body>
</html>
