<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f8f8f7">
    <title>Профиль · EventSync</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/profile.css">
    <script type="module" src="/js/profile.js"></script>
</head>
<body>
    <main class="profile-screen">
        <header class="profile-header">
            <a class="profile-home" href="/" aria-label="Вернуться к моим событиям">
                <span aria-hidden="true">←</span>
            </a>
            <h1>Профиль</h1>
        </header>

        <p id="profile-status" class="profile-status" role="status">Загружаем профиль…</p>

        <div id="profile-details" hidden>
            <section class="profile-card" aria-labelledby="profile-name">
                <div id="profile-avatar" class="profile-avatar" aria-hidden="true"></div>
                <h2 id="profile-name"></h2>
            </section>

            <dl class="profile-stats" aria-label="Статистика мероприятий">
                <div class="profile-stat">
                    <dt>Посещено</dt>
                    <dd id="profile-attended-count"></dd>
                </div>
                <div class="profile-stat">
                    <dt>Организовано</dt>
                    <dd aria-label="Нет данных">—</dd>
                </div>
            </dl>

            <section class="profile-history" aria-labelledby="profile-history-title">
                <h2 id="profile-history-title">История мероприятий</h2>
                <p>История пока недоступна.</p>
            </section>
        </div>
    </main>
</body>
</html>
