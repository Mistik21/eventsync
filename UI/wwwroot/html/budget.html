<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Бюджет · EventSync</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/budget.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="/js/budget.js"></script>
</head>
<body>
    <main class="budget-screen">
        <header class="budget-header">
            <a id="budget-back" class="budget-back" href="/" aria-label="Назад к событию">←</a>
            <h1>Бюджет</h1>
        </header>

        <p id="budget-status" class="budget-status" role="status">Загружаем бюджет…</p>
        <button id="budget-retry" class="budget-retry" type="button" hidden>Повторить</button>

        <section id="budget-closed" class="budget-closed" aria-labelledby="budget-closed-title" hidden>
            <div class="budget-circle" aria-hidden="true"></div>
            <h2 id="budget-closed-title">Сбор пока не открыт</h2>
            <p>Запланированный бюджет: <span id="budget-planned"></span></p>
            <button id="budget-open" class="budget-button" type="button" aria-label="Открыть сбор" hidden>Открыть</button>
        </section>

        <div id="budget-active" class="budget-active" hidden>
            <section class="budget-summary" aria-label="Сводка бюджета">
                <h2 id="budget-total" tabindex="-1"></h2>
                <progress id="budget-progress" max="1" value="0" aria-label="Собрано от запланированного бюджета"></progress>
                <dl class="budget-totals">
                    <div><dt>Собрано</dt><dd id="budget-collected"></dd></div>
                    <div><dt>Потрачено</dt><dd id="budget-spent"></dd></div>
                    <div><dt>Остаток</dt><dd id="budget-balance"></dd></div>
                </dl>
            </section>

            <section aria-labelledby="budget-contributions-title">
                <div class="budget-section-heading">
                    <h2 id="budget-contributions-title" tabindex="-1">Взносы участников</h2>
                    <span id="budget-paid-count"></span>
                </div>
                <ul id="budget-contributions" class="budget-list"></ul>
                <p id="budget-no-contributions" class="budget-empty" hidden>Участников пока нет.</p>
            </section>

            <section aria-labelledby="budget-costs-title">
                <h2 id="budget-costs-title" class="budget-section-heading" tabindex="-1">Траты</h2>
                <ul id="budget-costs" class="budget-list budget-costs"></ul>
                <p id="budget-no-costs" class="budget-empty" hidden>Трат пока нет.</p>
            </section>
        </div>

        <footer id="budget-footer" class="budget-footer" hidden>
            <button id="budget-add-cost" class="budget-button" type="button">+ Добавить трату</button>
        </footer>
    </main>

    <template id="budget-row-template">
        <li class="budget-person">
            <span class="budget-avatar" aria-hidden="true"></span>
            <div class="budget-person-details"><strong></strong><small></small></div>
            <span class="budget-badge"></span>
            <button type="button" class="budget-button budget-pay" hidden>Я скинул</button>
        </li>
    </template>

    <dialog id="budget-cost-details" class="budget-cost-dialog" aria-labelledby="budget-cost-details-title">
        <header>
            <h2 id="budget-cost-details-title"></h2>
            <button id="budget-close-details" class="budget-close-cost" type="button" aria-label="Закрыть окно">×</button>
        </header>
        <dl class="budget-cost-field budget-cost-details-field">
            <dt>Сумма</dt>
            <dd id="budget-cost-details-amount"></dd>
        </dl>
        <div class="budget-cost-actions">
            <button id="budget-edit-cost" class="budget-button budget-button-secondary" type="button">Редактировать</button>
            <button id="budget-delete-cost" class="budget-button budget-button-danger" type="button">Удалить</button>
        </div>
    </dialog>

    <dialog id="budget-cost-dialog" class="budget-cost-dialog" aria-labelledby="budget-cost-dialog-title">
        <header>
            <h2 id="budget-cost-dialog-title">Новая запись</h2>
            <button id="budget-close-cost" class="budget-close-cost" type="button" aria-label="Закрыть окно">×</button>
        </header>
        <form id="budget-cost-form">
            <div class="budget-cost-field">
                <label for="budget-cost-name">На что потратили</label>
                <input id="budget-cost-name" name="title" type="text" placeholder="Введите текст…" required autofocus>
            </div>
            <div class="budget-cost-field">
                <label for="budget-cost-amount">Сумма</label>
                <div class="budget-amount-field">
                    <input id="budget-cost-amount" name="amount" type="number" inputmode="numeric" min="1" max="2147483647" step="1" placeholder="0" required>
                    <span aria-hidden="true">₽</span>
                </div>
            </div>
            <p id="budget-cost-error" class="budget-status" data-error="true" role="alert" hidden></p>
            <button id="budget-save-cost" class="budget-button" type="submit">Создать</button>
        </form>
    </dialog>

    <dialog id="budget-delete-dialog" class="budget-cost-dialog" aria-labelledby="budget-delete-title">
        <h2 id="budget-delete-title"></h2>
        <div class="budget-cost-actions">
            <p id="budget-delete-error" class="budget-status" data-error="true" role="alert" hidden></p>
            <button id="budget-cancel-delete" class="budget-button budget-button-secondary" type="button" autofocus>Отмена</button>
            <button id="budget-confirm-delete" class="budget-button budget-button-danger" type="button">Удалить</button>
        </div>
    </dialog>
</body>
</html>
